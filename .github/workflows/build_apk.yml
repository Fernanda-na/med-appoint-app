name: Build MedAppoint Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Permet d'exécuter le build manuellement depuis l'interface GitHub

jobs:
  build-apk:
    name: Build Android APK (Expo / React Native)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile-app-legacy

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurer Node.js (Version 20)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './mobile-app-legacy/package-lock.json'

      # 3. Configurer Java 17 (Nécessaire pour Gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Installer les dépendances Node / Expo
      - name: Install Node Dependencies
        run: npm install

      # 5. Donner les permissions d'exécution à Gradlew
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # 6. Compiler l'APK Android
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 7. Sauvegarder l'APK généré comme artefact téléchargeable sur GitHub
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: medappoint-app-debug-apk
          path: mobile-app-legacy/android/app/build/outputs/apk/debug/app-debug.apk
